      <stop stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#F0F7EA"/>
    </linearGradient>
  </defs>
  <rect x="15" y="27" width="482" height="129" rx="54" fill="#30485F" opacity=".2"/>
