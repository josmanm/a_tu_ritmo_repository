  <title>Tempo Tap — propuesta de estilo pastel</title>
  <desc>Lamina conceptual con montanas sobre el fondo de Ritmo Basico, corredor corriendo, saltando y deslizandose boca abajo, con cabeza y manos hacia adelante bajo un pajaro, y tronco para saltar. No integrado en Unity.</desc>
